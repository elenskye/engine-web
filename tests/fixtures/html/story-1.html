<article><h1>示例市地铁四十年</h1>
<h2>一号线：从图纸到通车</h2>
<p>1986 年，示例市第一条地铁线路的图纸摆上了规划局的桌子。那时全市只有四条公交干线，早高峰的车厢里常常挤得连车门都关不上。</p>
<p>工程从 1988 年春天开工，盾构机在老城区的地下一天只能推进四米。施工队把每一段隧道的进度写在工地门口的黑板上，路过的居民每天都会停下来看一眼。</p>
<figure><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="/img/2026/metro-1988.jpg" alt="" width="800" height="533"><figcaption>1988 年的一号线工地（示例市档案馆）</figcaption></figure>
<p>1993 年 10 月，一号线首段通车，全长 9.8 公里，设 7 座车站。第一天就有十一万人次乘车，比预计多了一倍。</p>
