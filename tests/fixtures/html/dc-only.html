<h1>Winter heating schedule</h1>
<p>District heating will start on 10 November this year, five days earlier than usual, because of the cold forecast. Residents whose radiators stay cold should call the heating hotline.</p>
<p>Repairs reported before 18:00 will be visited the same day.</p>
