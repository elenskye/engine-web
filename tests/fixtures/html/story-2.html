<article><h1>示例市地铁四十年</h1>
<h2>二号线和三号线：织成一张网</h2>
<p>进入新世纪，城市往东扩，二号线沿着新开的大道一路向东，把开发区和老城连了起来。二号线在 2004 年通车，第一次实现了两条线的换乘。</p>
<p>三号线是第一条全程地下的环线，2011 年通车以后，从城东到城西不用再绕进市中心换乘，平均通勤时间少了十二分钟。</p>
<figure><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="/img/2026/metro-2004.jpg" alt="" width="800" height="533"><figcaption>二号线通车那天的站台</figcaption></figure>
<p>到 2015 年，示例市已经有三条线路、61 座车站，日均客流突破一百万人次。</p>
