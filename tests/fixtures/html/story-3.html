<article><h1>示例市地铁四十年</h1>
<h2>五号线以后：往郊区走</h2>
<p>最近十年修的线路大多往郊区走。五号线南延段在 2026 年 11 月通车，全长 12.6 公里，把南部新城纳进了地铁网。</p>
<p>规划里还有六号线和七号线，预计 2032 年以前全部开通，到那时全市地铁总里程会超过三百公里。</p>
<figure><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="/img/2026/metro-2026.jpg" alt="" width="800" height="533"><figcaption>五号线南延段的新车站</figcaption></figure>
<p>四十年里，示例市地铁从一条 9.8 公里的线路长成了一张网，每天有两百多万人在地下穿过这座城市。</p>
