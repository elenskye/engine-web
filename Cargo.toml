[package]
name = "engine-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Peck、Pith、Pomelo 共用的网页引擎：搜索、抓取、取正文"
license = "UNLICENSED"
publish = false

[dependencies]
# 跟 Peck 同一版（和 Tauri 共用 html5ever 0.39），见 THIRD_PARTY.md
dom_smoothie = "^0.18.2"
dom_query = { version = "^0.28.0", features = ["markdown"] }
encoding_rs = "^0.8.44"
regex = "^1.13.2"
url = "^2.5.9"

[dev-dependencies]
serde_json = "^1.0.154"
