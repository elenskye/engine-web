[package]
name = "engine-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Peck、Pith、Pomelo 共用的网页引擎：搜索、抓取、取正文"
license = "UNLICENSED"
publish = false

[dependencies]
chardetng = "^1.0.0"
# 跟 Peck 同一版（和 Tauri 共用 html5ever 0.39），见 THIRD_PARTY.md
dom_smoothie = "^0.18.2"
dom_query = { version = "^0.28.0", features = ["markdown"] }
encoding_rs = "^0.8.44"
engine-core = { git = "https://github.com/elenskye/engine-core", tag = "v0.2.0" }
regex = "^1.13.2"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
url = "^2.5.9"

[[bin]]
name = "engine-web"
path = "src/bin/engine-web.rs"
